[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license` expression below.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysceptre"
version = "0.1.0"
description = "Standalone Python port of sceptre's CRT discovery-analysis statistical engine (complement control group)"
readme = "README.md"
requires-python = ">=3.10"
# GPL-3.0-only, not -or-later: upstream sceptre's DESCRIPTION says
# `License: GPL-3`, which in R packaging means version 3 exactly
# (`GPL (>= 3)` is the or-later form). Don't grant more than we received.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Siddarth Wekhande" },
    { name = "Eugenio Mattei" },
    { name = "Broad Institute of MIT and Harvard" },
]
keywords = [
    "crispr",
    "single-cell",
    "sceptre",
    "conditional-randomization-test",
    "differential-expression",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6", "pre-commit>=3.0"]
fast = ["numba>=0.58"]
# Dev-only, for the scripts/ dataset-export and benchmark path: `mudata` reads
# and writes the two-assay .h5mu input, `pyarrow` the result parquet, and
# `matplotlib` draws the calibration QQ plot. Nothing under src/
# imports either, so this stays out of the runtime dependencies -- installing
# pysceptre to call `run_discovery_analysis` on in-memory arrays needs neither.
io = ["mudata>=0.3", "anndata>=0.10", "pyarrow>=14", "matplotlib>=3.7"]
# Only for examples/scanpy_interop.py, which demonstrates that a run sits
# inside an ordinary scanpy workflow. Nothing in src/ imports scanpy.
examples = ["pysceptre[io]", "scanpy>=1.10", "igraph>=0.11", "leidenalg>=0.10"]
# Dev-only, for the GitHub Pages site (`mkdocs serve` / `mkdocs build`).
# `mkdocstrings` reads the API reference straight out of the docstrings, and
# reads them statically via griffe -- the package is never imported to build
# the site, so numba and the io extra are not needed on the docs runner.
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/broadinstitute/pysceptre"
Repository = "https://github.com/broadinstitute/pysceptre"
Issues = "https://github.com/broadinstitute/pysceptre/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `realdata` marks the slow regression tests against R on a real screen. They
# need data that is never committed, so they are deselected by default. Named
# for the kind of test rather than a dataset, so swapping the dataset does not
# mean renaming the marker.
addopts = "-m 'not realdata'"
markers = [
    "realdata: regression tests against R sceptre on a real screen (slow, needs local data)",
]

[tool.ruff]
line-length = 100
indent-width = 4


[tool.ruff.lint]
# E501 is off: the formatter owns line length, and leaving it on flags prose in
# docstrings it cannot rewrap -- this package's docstrings carry the porting
# rationale and are deliberately long.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501"]

# Markdown code blocks are excluded: recent ruff versions format embedded
# Python inside .md, which would rewrite the hand-aligned snippets in
# README.md / TUTORIAL.md.
[tool.ruff.format]
indent-style = "space"
exclude = ["*.md"]
