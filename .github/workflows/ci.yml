name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Pinned to the same version as .pre-commit-config.yaml -- bump both together.
      - run: uvx ruff@0.16.8 check .
      - run: uvx ruff@0.16.8 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Also creates and activates .venv on this interpreter, so there is
          # deliberately no `uv venv` step -- adding one fails with
          # "a virtual environment already exists at: .venv".
          python-version: ${{ matrix.python-version }}
      # tests/validation/ground_truth.json is committed, so the suite runs
      # without R/sceptre installed -- conftest only shells out to Rscript
      # when that cached fixture is missing.
      - run: uv pip install -e ".[dev,fast]"
      # --no-sync: install unlocked, deliberately. uv.lock is committed so a
      # contributor's `uv sync` is reproducible, but the matrix resolves fresh
      # against the pyproject ranges so upstream breakage surfaces here rather
      # than being hidden behind pins. The `lock` job below keeps the committed
      # lockfile honest.
      - run: uv run --no-sync pytest -q

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Fails if uv.lock is out of date with pyproject.toml. Without this the
      # committed lockfile silently drifts, since no other job reads it.
      - run: uv lock --check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
